<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美国空气质量健康风险地图 · 数据分析项目</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --text: #24292f; --muted: #57606a;
    --border: #d0d7de; --accent: #0969da; --code-bg: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .banner { background: linear-gradient(135deg, #1f6feb 0%, #0b3d91 100%);
            color: #fff; padding: 48px 24px 40px; text-align: center; }
  .banner h1 { margin: 0 0 8px; font-size: 28px; }
  .banner p  { margin: 0; opacity: .85; font-size: 15px; }
  .container { max-width: 980px; margin: -24px auto 64px; padding: 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 12px; padding: 40px 48px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  @media (max-width: 640px) { .card { padding: 24px 18px; } }
  .card img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; }
  .card h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .card h2 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: 1.6em; }
  .card h3 { font-size: 16px; margin-top: 1.4em; }
  .card table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .card th, .card td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .card th { background: var(--code-bg); }
  .card tr:nth-child(even) td { background: #fafbfc; }
  .card code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
               font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .card pre  { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
               padding: 16px; overflow-x: auto; }
  .card pre code { background: none; padding: 0; }
  .card blockquote { margin: 12px 0; padding: 4px 16px; color: var(--muted);
                     border-left: 4px solid var(--accent); background: #f0f6ff; border-radius: 0 8px 8px 0; }
  .card a { color: var(--accent); text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .card ul, .card ol { padding-left: 1.6em; }
  .card li { margin: 4px 0; line-height: 1.7; }
  .card p  { line-height: 1.8; }
  .footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
  #toc { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
         padding: 12px 20px; font-size: 14px; margin: 16px 0; }
  #toc a { color: var(--accent); }
</style>
</head>
<body>
<div class="banner">
  <h1>美国空气质量健康风险地图</h1>
  <p>基于 32.4 万条 EPA 监测数据的探索性数据分析 · 求职作品集项目</p>
</div>
<div class="container">
  <div class="card" id="content">
    <p style="color:#57606a">正在加载报告…</p>
  </div>
  <div class="footer">
    技术栈：Python · Pandas · Matplotlib · Seaborn ｜ 数据来源：U.S. EPA
  </div>
</div>
<script>
fetch('README.md')
  .then(r => { if (!r.ok) throw new Error('README.md 加载失败'); return r.text(); })
  .then(md => {
    // 去掉文档顶部的 H1/H2（横幅已展示标题），从第一个分隔线后开始
    const parts = md.split(/\n---\n/);
    const body = parts.length > 1 ? parts.slice(1).join('\n---\n') : md;
    document.getElementById('content').innerHTML = marked.parse(body);
    document.title = '美国空气质量健康风险地图 · 数据分析项目';
  })
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<p style="color:#c0392b">报告加载失败：' + err.message + '</p>';
  });
</script>
</body>
</html>
